[package]
name = "rust-coding-challenge"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
rust_decimal = { version = "1.42.1", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }

# The safety rules the code is written to are enforced by the compiler rather
# than left to review. They apply to every target of the crate, the binary
# included; the exceptions for test code live in `clippy.toml`.
[lints.rust]
# The engine handles money: there is no reason for it to reach for unsafe, and
# `forbid` means not even a local `allow` can turn this off again.
unsafe_code = "forbid"

[lints.clippy]
# Nothing outside the tests may panic. Every failure is a value the caller has
# to deal with, so a bad record or an unreadable file ends the run with a
# message rather than a backtrace, and no input can take the process down
# part-way through a report.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Balances are fixed-point decimals. A float would silently lose cents, so the
# type is not merely avoided by convention — arithmetic on one will not compile.
float_arithmetic = "deny"

# The engine is normally run through `cargo run`, which builds without
# optimizations, and an unoptimized build spends roughly eight times as long on
# the same input. Turning the optimizer on for the debug profile brings it
# within a third of a release build while keeping the debug assertions and the
# arithmetic overflow checks, which are what the profile is for.
[profile.dev]
opt-level = 1

# The dependencies do the parsing and the decimal arithmetic, so they are worth
# optimizing fully. They are compiled once and then cached, so this costs
# nothing on a rebuild of the crate itself.
[profile.dev.package."*"]
opt-level = 3
