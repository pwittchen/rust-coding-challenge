name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Check formatting
      run: cargo fmt --check
    - name: Build
      run: cargo build --verbose
    # The profile the efficiency figures in the README are measured on, and the
    # one a reviewer running a large input would reach for, so it is built here
    # rather than left to break unnoticed.
    - name: Build (release)
      run: cargo build --release --verbose
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --verbose
